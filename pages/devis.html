<!-- pages/devis.html -->
<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Demande de devis – Chevalier Divertissements</title>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../style/css/devis.css" />
        <link rel="stylesheet" href="../style/css/style.css" />
    </head>

    <body class="devis-page">
        <!-- NAVBAR (réduit pour la page formulaire) -->
        <header class="navbar navbar--plain">
            <div class="container">
                <a href="../index.html#hero" class="logo">
                    <img
                        src="../images/logo.svg"
                        alt="Logo Chevalier Divertissements"
                    />
                </a>
            </div>
        </header>

        <!-- FORMULAIRE -->
        <section class="devis-form-section">
            <div class="container">
                <h1 class="section-title">Obtenir un devis personnalisé</h1>
                <p>
                    Remplis le formulaire ci-dessous ; nous te recontacterons
                    sous 24 heures ouvrées avec une proposition détaillée et
                    gratuite.
                </p>

                <form class="devis__form" id="quoteForm">
                    <!-- Même markup que sur la home pour réutiliser le JS existant -->
                    <div class="form-group">
                        <label for="name">Nom</label>
                        <input type="text" id="name" name="name" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Mail</label>
                        <input type="email" id="email" name="email" required />
                    </div>

                    <div class="form-group">
                        <label for="phone">Téléphone</label>
                        <input type="tel" id="phone" name="phone" />
                    </div>

                    <div class="form-group">
                        <label for="event">Événement</label>
                        <input type="text" id="event" name="event" />
                    </div>

                    <div class="form-group">
                        <label for="subject">Sujet</label>
                        <select id="subject" name="subject">
                            <option value="structures">
                                Structures gonflables
                            </option>
                            <option value="costumes">
                                Costumes / Déguisements
                            </option>
                            <option value="decor">Décoration</option>
                            <option value="other">Autre</option>
                        </select>
                    </div>

                    <div class="form-group form-group--full">
                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn--accent">
                        Envoyer la demande
                    </button>
                </form>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="site-footer">
            <div class="container">
                <p class="footer__brand">chevalier divertissements</p>
            </div>
        </footer>

        <script src="../index.js"></script>
    </body>
</html>
